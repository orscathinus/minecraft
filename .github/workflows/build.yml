name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache and wrapper validation
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew --no-daemon clean build

      - name: Smoke-test the OpenGL application
        run: xvfb-run -a ./gradlew --no-daemon smokeTest
