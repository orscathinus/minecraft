name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up Gradle cache and wrapper validation
        uses: gradle/actions/setup-gradle@v6
      - name: Clean build and package desktop reference
        run: ./gradlew --no-daemon clean build distZip distTar
      - name: Verify packaged browser documentation and screenshots
        shell: bash
        run: |
          set -euo pipefail
          package="$(find build/distributions -maxdepth 1 -name '*.zip' -print -quit)"
          unzip -l "${package}" | grep -q 'browser/index.html'
          unzip -l "${package}" | grep -q 'browser/web/app.mjs'
          unzip -l "${package}" | grep -q 'KNOWN_DEVIATIONS.md'
          unzip -l "${package}" | grep -q 'FINAL_TEST_REPORT.md'
          unzip -l "${package}" | grep -q 'docs/screenshots/surface.png'
          unzip -l "${package}" | grep -q 'docs/screenshots/cave.png'
          unzip -l "${package}" | grep -q 'docs/screenshots/chunk-loading.png'
          unzip -l "${package}" | grep -q 'docs/screenshots/void.png'
      - name: Smoke-test the desktop OpenGL application
        run: xvfb-run -a ./gradlew --no-daemon smokeTest
      - name: Validate browser modules and tests
        run: |
          for module in web/*.mjs; do node --check "$module"; done
          node --check tools/benchmark-web.mjs
          node --check tools/fidelity-audit.mjs
          node --check tools/capture-screenshots.mjs
          node --check tools/capture-screenshots-impl.mjs
          node --test web/test/*.test.mjs
      - name: Run final fidelity and scope audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/diagnostics
          node tools/fidelity-audit.mjs --json | tee build/diagnostics/phase12-fidelity-audit.json
      - name: Record final deterministic benchmark
        shell: bash
        run: |
          set -euo pipefail
          node tools/benchmark-web.mjs --json | tee build/diagnostics/phase12-benchmark.json
      - name: Smoke-test browser WebGL 2 application
        run: bash web/test/browser-smoke.sh
      - name: Capture final browser screenshots
        run: |
          node tools/capture-screenshots.mjs --output build/screenshots
          test -s build/screenshots/surface.png
          test -s build/screenshots/cave.png
          test -s build/screenshots/chunk-loading.png
          test -s build/screenshots/void.png
      - name: Upload Phase 12 package and evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase12-package-and-evidence
          if-no-files-found: error
          retention-days: 30
          path: |
            build/distributions/*.zip
            build/distributions/*.tar
            build/diagnostics/*.json
            build/screenshots/*.png
