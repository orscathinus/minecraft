name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Gradle cache and wrapper validation
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test desktop target
        run: ./gradlew --no-daemon clean build

      - name: Smoke-test the desktop OpenGL application
        run: xvfb-run -a ./gradlew --no-daemon smokeTest

      - name: Validate browser target
        run: |
          node --check web/app.mjs
          node --check web/fixed-step-timer.mjs
          node --test web/test/*.test.mjs
